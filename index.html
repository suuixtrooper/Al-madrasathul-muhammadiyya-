<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Madrasathul Muhammadiyya | Premium Campus Website</title>
    
    <!-- ന്യൂ-ജെൻ പ്രീമിയം ഗൂഗിൾ ഫോണ്ടുകൾ -->
    <link href="https://googleapis.com" rel="stylesheet">

    <style>
        /* ==========================================
           1. ഗ്ലോബൽ സെറ്റിംഗ്സ് (എല്ലാ ഡിവൈസിനും ഒരേപോലെ)
           ========================================== */
        :root {
            --dark-bg: #07090e;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --neon-blue: #00f2fe;
            --neon-cyan: #4facfe;
            --neon-green: #10b981;
            --glass-card: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--dark-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-white);
            overflow-x: hidden;
        }

        /* സ്ക്രോൾ ബാർ കൂടുതൽ ഭംഗിയാക്കാൻ */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #07090e;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--neon-blue), var(--neon-cyan));
            border-radius: 10px;
        }

        /* ==========================================
           2. ആനിമേഷൻ ഇഫക്റ്റുകൾ (New-Gen Magic)
           ========================================== */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }

        /* ==========================================
           3. ബാക്ക്ഗ്രൗണ്ട് ഇമേജ് സെറ്റപ്പ് (Landscape View)
           ========================================== */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(180deg, rgba(7, 9, 14, 0.5) 0%, rgba(7, 9, 14, 0.9) 100%), url('madrasaphoto.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* ==========================================
           4. മോഡേൺ നാവിഗേഷൻ ബാർ (Header)
           ========================================== */
        .header-nav {
            width: 100%;
            max-width: 1400px;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInDown 1s ease-out forwards;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .logo-text {
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-white);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* ==========================================
           5. മെയിൻ ഹീറോ കണ്ടന്റ് (പോസ്റ്റർ ലുക്ക്)
           ========================================== */
        .hero-container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            padding: 40px 20px;
            animation: scaleIn 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .top-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            padding: 8px 24px;
            border-radius: 50px;
            margin-bottom: 25px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--neon-blue);
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .main-heading {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .title-white {
            display: block;
            color: var(--text-white);
        }

        .title-gradient {
            display: block;
            background: linear-gradient(135deg, #ffffff 20%, #a5b4fc 60%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 700;
            text-transform: none;
            letter-spacing: 0px;
        }

        .main-paragraph {
            font-size: 1.25rem;
            line-height: 1.85;
            color: var(--text-gray);
            max-width: 780px;
            margin: 0 auto 40px auto;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* 3D ബട്ടൺ സ്റ്റൈൽ */
        .location-btn-wrapper {
            position: relative;
            display: inline-block;
        }

        .location-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan));
            color: #07090e;
            text-decoration: none;
            padding: 18px 45px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
            position: relative;
        }

        .location-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 242, 254, 0.5);
            color: #fff;
        }

        .btn-glow-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan));
            border-radius: 50px;
            filter: blur(15px);
            opacity: 0.4;
            z-index: 1;
            animation: pulseGlow 3s infinite;
        }

        /* ==========================================
           6. ഫീച്ചറുകൾ കാണിക്കുന്ന ഗ്രിഡ് സെക്ഷൻ
           ========================================== */
        .info-grid {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 60px 20px;
            animation: fadeInUp 1.5s ease-out forwards;
        }

        .grid-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            text-align: left;
        }

        .grid-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 242, 254, 0.3);
            transform: translateY(-8px);
        }

        .card-number {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-gray);
            line-height: 1.5;
        }

        /* ==========================================
           7. ഫൂട്ടർ സെക്ഷൻ (Footer)
           ========================================== */
        .footer-dock {
            width: 100%;
            max-width: 1400px;
